<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submissions — Health Platform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="layout">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">Health<span>+</span></div>
      <div class="brand-sub">Information Management</div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="dashboard.html"   class="sidebar-link"><span class="dot dot-blue"></span> Dashboard</a>
      <a href="submissions.html" class="sidebar-link"><span class="dot dot-purple"></span> Submissions</a>
      <a href="forms.html"       class="sidebar-link"><span class="dot dot-green"></span> Forms</a>
      <div class="nav-section-label manager-only">Management</div>
      <a href="hospitals.html" class="sidebar-link manager-only"><span class="dot dot-orange"></span> Hospitals</a>
      <a href="users.html"     class="sidebar-link admin-only"><span class="dot dot-red"></span> Users</a>
      <a href="reports.html"   class="sidebar-link manager-only"><span class="dot dot-teal"></span> Reports</a>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-avatar" id="sidebar-avatar">U</div>
      <div class="sidebar-user-info">
        <div class="user-name-sb" id="sidebar-user-name">Loading…</div>
        <div class="user-role-sb" id="sidebar-user-role"></div>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button class="topbar-menu-btn" id="menu-toggle"><i class="bi bi-list"></i></button>
      <span class="topbar-title">Submissions</span>
      <div class="topbar-right">
        <button class="topbar-btn"><i class="bi bi-bell"></i></button>
        <div class="topbar-divider"></div>
        <div class="topbar-user">
          <div class="topbar-avatar" id="user-avatar">U</div>
          <div class="topbar-user-info">
            <div class="fw-600 small" id="user-name">Loading…</div>
            <div class="text-muted xsmall" id="user-role"></div>
          </div>
        </div>
        <button onclick="logout()" class="btn btn-outline btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
      </div>
    </header>

    <div class="page-body">
      <div class="page-header">
        <div>
          <h4 class="page-title">Submissions</h4>
          <p class="page-sub">View and manage all form submissions</p>
        </div>
        <button class="btn btn-primary" onclick="openNewModal()">
          <i class="bi bi-plus-lg me-1"></i>New Submission
        </button>
      </div>

      <!-- Filters -->
      <div class="card mb-3">
        <div class="card-body">
          <div class="filter-bar">
            <div class="filter-item">
              <input type="text" id="search" class="form-ctrl" placeholder="Search submissions…">
            </div>
            <div class="filter-item">
              <select id="filter-form" class="form-ctrl">
                <option value="">All Forms</option>
              </select>
            </div>
            <div class="filter-item">
              <select id="filter-status" class="form-ctrl">
                <option value="">All Statuses</option>
                <option value="draft">Draft</option>
                <option value="submitted">Submitted</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>
            <div class="filter-item">
              <select id="filter-hospital" class="form-ctrl manager-only">
                <option value="">All Hospitals</option>
              </select>
            </div>
            <button class="btn btn-primary" onclick="applyFilters()">
              <i class="bi bi-search me-1"></i>Search
            </button>
            <button class="btn btn-outline" onclick="resetFilters()">Reset</button>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="table-wrap">
          <table class="tbl">
            <thead>
              <tr>
                <th>#</th>
                <th>Form</th>
                <th>Submitted By</th>
                <th class="d-none d-md">Hospital</th>
                <th>Status</th>
                <th class="d-none d-md">Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="submissions-tbody">
              <tr><td colspan="7" class="tbl-empty">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="card-footer">
          <div id="submissions-pagination"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- View Modal -->
<div class="modal-overlay" id="view-modal">
  <div class="modal-box">
    <div class="modal-header">
      <h6 class="modal-title">Submission Details</h6>
      <button class="modal-close" onclick="closeModal('view-modal')">&times;</button>
    </div>
    <div class="modal-body" id="view-body">Loading…</div>
    <div class="modal-footer">
      <div id="review-actions"></div>
      <button class="btn btn-outline" onclick="closeModal('view-modal')">Close</button>
    </div>
  </div>
</div>

<!-- New Submission Modal -->
<div class="modal-overlay" id="new-modal">
  <div class="modal-box">
    <div class="modal-header">
      <h6 class="modal-title">New Submission</h6>
      <button class="modal-close" onclick="closeModal('new-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Form</label>
        <select id="new-form" class="form-ctrl" onchange="loadFormFields()">
          <option value="">Select form…</option>
        </select>
      </div>
      <div id="form-fields"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('new-modal')">Cancel</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveSubmission()">
        <i class="bi bi-check-lg me-1"></i>Submit
      </button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
let page = 1, allForms = [], currentSub = null;

(async () => {
  await requireAuth();
  await Promise.all([loadDropdowns(), loadSubmissions()]);
})();

async function loadDropdowns() {
  try {
    const [fRes, hRes] = await Promise.all([
      API.get('api/forms.php?status=published&per_page=100'),
      API.get('api/hospitals.php?per_page=200'),
    ]);
    allForms = fRes.data || [];
    const fOpts = allForms.map(f => `<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');
    document.getElementById('filter-form').innerHTML = '<option value="">All Forms</option>' + fOpts;
    document.getElementById('new-form').innerHTML    = '<option value="">Select form…</option>' + fOpts;
    const hOpts = (hRes.data||[]).map(h => `<option value="${esc(h.id)}">${esc(h.name)}</option>`).join('');
    document.getElementById('filter-hospital').innerHTML = '<option value="">All Hospitals</option>' + hOpts;
  } catch {}
}

function buildParams() {
  const p = new URLSearchParams({ page, per_page:15 });
  const s = document.getElementById('search').value.trim();
  const f = document.getElementById('filter-form').value;
  const st= document.getElementById('filter-status').value;
  const h = document.getElementById('filter-hospital').value;
  if (s)  p.set('search', s);
  if (f)  p.set('form_id', f);
  if (st) p.set('status', st);
  if (h)  p.set('hospital_id', h);
  return p;
}

async function loadSubmissions() {
  const tbody = document.getElementById('submissions-tbody');
  tbody.innerHTML = '<tr><td colspan="7" class="tbl-empty">Loading…</td></tr>';
  try {
    const res  = await API.get('api/submissions.php?' + buildParams());
    const rows = res.data || [];
    const meta = res.meta || {};
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="tbl-empty">No submissions found</td></tr>';
    } else {
      tbody.innerHTML = rows.map((r,i) => `
        <tr>
          <td class="text-muted small">${(page-1)*15+i+1}</td>
          <td class="fw-500">${esc(r.form_name||'—')}</td>
          <td>${esc(r.submitted_by_name||'—')}</td>
          <td class="d-none d-md text-muted small">${esc(r.hospital_name||'—')}</td>
          <td>${badge(r.status)}</td>
          <td class="d-none d-md text-muted small">${fmtDate(r.submitted_at||r.created_at)}</td>
          <td>
            <button class="btn btn-outline btn-sm" onclick="viewSubmission('${r.id}')">
              <i class="bi bi-eye"></i>
            </button>
          </td>
        </tr>`).join('');
    }
    renderPagination('submissions-pagination', (meta.page||res.page)||1, (meta.pages||res.pages)||1, (meta.total||res.total)||0, 15, p => { page=p; loadSubmissions(); });
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="7" class="tbl-empty text-danger">Error: ${esc(e.message)}</td></tr>`;
  }
}

function applyFilters() { page = 1; loadSubmissions(); }
function resetFilters() {
  document.getElementById('search').value        = '';
  document.getElementById('filter-form').value   = '';
  document.getElementById('filter-status').value = '';
  document.getElementById('filter-hospital').value = '';
  applyFilters();
}

async function viewSubmission(id) {
  openModal('view-modal');
  document.getElementById('view-body').innerHTML = '<div class="tbl-empty">Loading…</div>';
  document.getElementById('review-actions').innerHTML = '';
  try {
    const res = await API.get('api/submissions.php?id=' + id);
    const sub = res.data;
    currentSub = sub;
    const values = sub.values || [];
    const rows = values.map(v => {
      const val = v.value_text ?? v.value_number ?? v.value_date ?? '—';
      return `<div class="detail-row">
        <div class="detail-label">${esc(v.label)}</div>
        <div class="detail-value">${esc(String(val))}</div>
      </div>`;
    }).join('') || '<p class="text-muted">No field data recorded</p>';
    document.getElementById('view-body').innerHTML = `
      <div class="detail-row"><div class="detail-label">Form</div><div class="detail-value fw-500">${esc(sub.form_name||'—')}</div></div>
      <div class="detail-row"><div class="detail-label">Status</div><div class="detail-value">${badge(sub.status)}</div></div>
      <div class="detail-row"><div class="detail-label">Submitted By</div><div class="detail-value">${esc(sub.submitted_by_name||'—')}</div></div>
      <div class="detail-row"><div class="detail-label">Hospital</div><div class="detail-value">${esc(sub.hospital_name||'—')}</div></div>
      <div class="detail-row"><div class="detail-label">Date</div><div class="detail-value">${fmtDateTime(sub.submitted_at||sub.created_at)}</div></div>
      <hr style="border-color:var(--border);margin:12px 0">
      ${rows}`;

    if (sub.status === 'submitted' && currentUser && ['super_admin','regional_admin','hospital_admin'].includes(currentUser.role)) {
      document.getElementById('review-actions').innerHTML = `
        <button class="btn btn-primary btn-sm me-2" onclick="review('${id}','approved')"><i class="bi bi-check-lg me-1"></i>Approve</button>
        <button class="btn btn-danger btn-sm" onclick="review('${id}','rejected')"><i class="bi bi-x-lg me-1"></i>Reject</button>`;
    }
  } catch (e) {
    document.getElementById('view-body').innerHTML = `<p class="text-danger">${esc(e.message)}</p>`;
  }
}

async function review(id, status) {
  try {
    await API.put('api/submissions.php?id=' + id, { status });
    toast('Submission ' + status, 'success');
    closeModal('view-modal');
    loadSubmissions();
  } catch (e) {
    toast(e.message, 'error');
  }
}

function openNewModal() {
  document.getElementById('form-fields').innerHTML = '';
  document.getElementById('new-form').value = '';
  openModal('new-modal');
}

async function loadFormFields() {
  const formId = document.getElementById('new-form').value;
  if (!formId) { document.getElementById('form-fields').innerHTML = ''; return; }
  try {
    const res    = await API.get('api/forms.php?id=' + formId);
    const form   = res.data;
    const allFields = [];
    (form.sections||[]).forEach(s => (s.fields||[]).forEach(f => allFields.push(f)));
    document.getElementById('form-fields').innerHTML = allFields.map(f => `
      <div class="form-group">
        <label class="form-label">${esc(f.label)}${f.is_required?'<span style="color:#ef3826">*</span>':''}</label>
        ${f.field_type === 'textarea'
          ? `<textarea class="form-ctrl" data-field-id="${esc(f.id)}" ${f.is_required?'required':''}></textarea>`
          : f.field_type === 'select'
          ? `<select class="form-ctrl" data-field-id="${esc(f.id)}" ${f.is_required?'required':''}><option value="">Select…</option>${(f.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`
          : `<input type="${esc(f.field_type||'text')}" class="form-ctrl" data-field-id="${esc(f.id)}" ${f.is_required?'required':''}>`
        }
      </div>`).join('');
  } catch (e) { toast(e.message,'error'); }
}

async function saveSubmission() {
  const formId = document.getElementById('new-form').value;
  if (!formId) { toast('Please select a form','warning'); return; }
  const btn    = document.getElementById('save-btn');
  const inputs = document.querySelectorAll('#form-fields [data-field-id]');
  const values = {};
  for (const el of inputs) {
    if (el.required && !el.value.trim()) { toast('Please fill all required fields','warning'); return; }
    values[el.dataset.fieldId] = el.value;
  }
  setLoading(btn, true);
  try {
    await API.post('api/submissions.php', { form_id: formId, values, status:'submitted' });
    toast('Submission saved successfully','success');
    closeModal('new-modal');
    loadSubmissions();
  } catch (e) {
    toast(e.message,'error');
  } finally {
    setLoading(btn, false);
  }
}

document.getElementById('search').addEventListener('keydown', e => { if (e.key==='Enter') applyFilters(); });
</script>
</body>
</html>
