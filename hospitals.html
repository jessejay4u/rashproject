<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospitals — Health Platform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">Health<span>+</span></div>
      <div class="brand-sub">Information Management</div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="dashboard.html"   class="sidebar-link"><span class="dot dot-blue"></span> Dashboard</a>
      <a href="submissions.html" class="sidebar-link"><span class="dot dot-purple"></span> Submissions</a>
      <a href="forms.html"       class="sidebar-link"><span class="dot dot-green"></span> Forms</a>
      <div class="nav-section-label manager-only">Management</div>
      <a href="hospitals.html" class="sidebar-link manager-only"><span class="dot dot-orange"></span> Hospitals</a>
      <a href="users.html"     class="sidebar-link admin-only"><span class="dot dot-red"></span> Users</a>
      <a href="reports.html"   class="sidebar-link manager-only"><span class="dot dot-teal"></span> Reports</a>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-avatar" id="sidebar-avatar">U</div>
      <div class="sidebar-user-info">
        <div class="user-name-sb" id="sidebar-user-name">Loading…</div>
        <div class="user-role-sb" id="sidebar-user-role"></div>
      </div>
    </div>
  </nav>

  <div class="main">
    <header class="topbar">
      <button class="topbar-menu-btn" id="menu-toggle"><i class="bi bi-list"></i></button>
      <span class="topbar-title">Hospitals</span>
      <div class="topbar-right">
        <button class="topbar-btn"><i class="bi bi-bell"></i></button>
        <div class="topbar-divider"></div>
        <div class="topbar-user">
          <div class="topbar-avatar" id="user-avatar">U</div>
          <div class="topbar-user-info">
            <div class="fw-600 small" id="user-name">Loading…</div>
            <div class="text-muted xsmall" id="user-role"></div>
          </div>
        </div>
        <button onclick="logout()" class="btn btn-outline btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
      </div>
    </header>

    <div class="page-body">
      <div class="page-header">
        <div>
          <h4 class="page-title">Hospitals</h4>
          <p class="page-sub">Manage hospital facilities and regions</p>
        </div>
        <button class="btn btn-primary admin-only" id="new-hosp-btn">
          <i class="bi bi-plus-lg me-1"></i>Add Hospital
        </button>
      </div>

      <div class="card mb-3">
        <div class="card-body">
          <div class="filter-bar">
            <div class="filter-item">
              <input type="text" id="search" class="form-ctrl" placeholder="Search hospitals…">
            </div>
            <div class="filter-item">
              <select id="filter-region" class="form-ctrl">
                <option value="">All Regions</option>
              </select>
            </div>
            <div class="filter-item">
              <select id="filter-status" class="form-ctrl">
                <option value="">All Statuses</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
            <button class="btn btn-primary" onclick="applyFilters()"><i class="bi bi-search me-1"></i>Search</button>
            <button class="btn btn-outline" onclick="resetFilters()">Reset</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="tbl">
            <thead>
              <tr>
                <th>#</th>
                <th>Hospital</th>
                <th class="d-none d-md">Region</th>
                <th class="d-none d-md">Type</th>
                <th>Status</th>
                <th class="d-none d-md">Beds</th>
                <th class="admin-only">Actions</th>
              </tr>
            </thead>
            <tbody id="hospitals-tbody">
              <tr><td colspan="7" class="tbl-empty">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="card-footer">
          <div id="hospitals-pagination"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Hospital Modal -->
<div class="modal-overlay" id="hosp-modal">
  <div class="modal-box">
    <div class="modal-header">
      <h6 class="modal-title" id="modal-title">Add Hospital</h6>
      <button class="modal-close" onclick="closeModal('hosp-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="grid-2" style="gap:12px">
        <div class="form-group">
          <label class="form-label">Hospital Name <span style="color:#ef3826">*</span></label>
          <input type="text" id="h-name" class="form-ctrl" placeholder="Hospital name">
        </div>
        <div class="form-group">
          <label class="form-label">Region</label>
          <select id="h-region" class="form-ctrl">
            <option value="">Select region…</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Type</label>
          <select id="h-type" class="form-ctrl">
            <option value="public">Public</option>
            <option value="private">Private</option>
            <option value="ngo">NGO</option>
            <option value="mission">Mission</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Beds</label>
          <input type="number" id="h-beds" class="form-ctrl" placeholder="0" min="0">
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="text" id="h-phone" class="form-ctrl" placeholder="+1 234 567 8900">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="h-email" class="form-ctrl" placeholder="info@hospital.org">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Address</label>
        <textarea id="h-address" class="form-ctrl" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select id="h-status" class="form-ctrl">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('hosp-modal')">Cancel</button>
      <button class="btn btn-primary" id="save-hosp-btn" onclick="saveHospital()"><i class="bi bi-check-lg me-1"></i>Save</button>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal-box modal-sm">
    <div class="modal-header">
      <h6 class="modal-title">Delete Hospital</h6>
      <button class="modal-close" onclick="closeModal('delete-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <p>Are you sure you want to delete <strong id="delete-name"></strong>?</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('delete-modal')">Cancel</button>
      <button class="btn btn-danger" id="confirm-delete-btn" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
let page = 1, deleteId = null, allRegions = [];

(async () => {
  await requireAuth();
  await loadRegions();
  loadHospitals();
  document.getElementById('new-hosp-btn')?.addEventListener('click', openNewHosp);
})();

async function loadRegions() {
  try {
    const res = await API.get('api/regions.php?per_page=200');
    allRegions = res.data || [];
    const opts = allRegions.map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('');
    document.getElementById('filter-region').innerHTML = '<option value="">All Regions</option>' + opts;
    document.getElementById('h-region').innerHTML      = '<option value="">Select region…</option>' + opts;
  } catch {}
}

function buildParams() {
  const p = new URLSearchParams({ page, per_page:15 });
  const s  = document.getElementById('search').value.trim();
  const r  = document.getElementById('filter-region').value;
  const st = document.getElementById('filter-status').value;
  if (s)  p.set('search', s);
  if (r)  p.set('region_id', r);
  if (st) p.set('status', st);
  return p;
}

async function loadHospitals() {
  const tbody = document.getElementById('hospitals-tbody');
  tbody.innerHTML = '<tr><td colspan="7" class="tbl-empty">Loading…</td></tr>';
  try {
    const res  = await API.get('api/hospitals.php?' + buildParams());
    const rows = res.data || [];
    const meta = res.meta || {};
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="tbl-empty">No hospitals found</td></tr>';
    } else {
      tbody.innerHTML = rows.map((r,i) => `
        <tr>
          <td class="text-muted small">${(page-1)*15+i+1}</td>
          <td class="fw-500">${esc(r.name)}</td>
          <td class="d-none d-md text-muted small">${esc(r.region_name||'—')}</td>
          <td class="d-none d-md text-muted small">${esc(r.type||'—')}</td>
          <td>${badge(r.status||'active')}</td>
          <td class="d-none d-md text-muted small">${r.bed_count||'—'}</td>
          <td class="admin-only">
            <button class="btn btn-outline btn-sm me-1" onclick="editHospital('${r.id}')"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-danger btn-sm" onclick="promptDelete('${r.id}','${esc(r.name).replace(/'/g,"\\'")}')" ><i class="bi bi-trash"></i></button>
          </td>
        </tr>`).join('');
    }
    renderPagination('hospitals-pagination', (meta.page||res.page)||1, (meta.pages||res.pages)||1, (meta.total||res.total)||0, 15, p => { page=p; loadHospitals(); });
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="7" class="tbl-empty text-danger">Error: ${esc(e.message)}</td></tr>`;
  }
}

function applyFilters() { page=1; loadHospitals(); }
function resetFilters() {
  document.getElementById('search').value='';
  document.getElementById('filter-region').value='';
  document.getElementById('filter-status').value='';
  applyFilters();
}

function openNewHosp() {
  document.getElementById('modal-title').textContent = 'Add Hospital';
  document.getElementById('edit-id').value   = '';
  document.getElementById('h-name').value    = '';
  document.getElementById('h-region').value  = '';
  document.getElementById('h-type').value    = 'public';
  document.getElementById('h-beds').value    = '';
  document.getElementById('h-phone').value   = '';
  document.getElementById('h-email').value   = '';
  document.getElementById('h-address').value = '';
  document.getElementById('h-status').value  = 'active';
  openModal('hosp-modal');
}

async function editHospital(id) {
  try {
    const res = await API.get('api/hospitals.php?id=' + id);
    const h   = res.data;
    document.getElementById('modal-title').textContent = 'Edit Hospital';
    document.getElementById('edit-id').value   = h.id;
    document.getElementById('h-name').value    = h.name;
    document.getElementById('h-region').value  = h.region_id||'';
    document.getElementById('h-type').value    = h.type||'public';
    document.getElementById('h-beds').value    = h.bed_count||'';
    document.getElementById('h-phone').value   = h.phone||'';
    document.getElementById('h-email').value   = h.email||'';
    document.getElementById('h-address').value = h.address||'';
    document.getElementById('h-status').value  = h.status||'active';
    openModal('hosp-modal');
  } catch (e) { toast(e.message,'error'); }
}

async function saveHospital() {
  const id   = document.getElementById('edit-id').value;
  const name = document.getElementById('h-name').value.trim();
  if (!name) { toast('Hospital name is required','warning'); return; }
  const btn  = document.getElementById('save-hosp-btn');
  setLoading(btn, true);
  const body = {
    name,
    region_id: document.getElementById('h-region').value||null,
    type:      document.getElementById('h-type').value,
    bed_count: document.getElementById('h-beds').value||null,
    phone:     document.getElementById('h-phone').value.trim(),
    email:     document.getElementById('h-email').value.trim(),
    address:   document.getElementById('h-address').value.trim(),
    status:    document.getElementById('h-status').value,
  };
  try {
    if (id) await API.put('api/hospitals.php?id='+id, body);
    else    await API.post('api/hospitals.php', body);
    toast('Hospital saved successfully','success');
    closeModal('hosp-modal');
    loadHospitals();
  } catch (e) {
    toast(e.message,'error');
  } finally {
    setLoading(btn, false);
  }
}

function promptDelete(id, name) {
  deleteId = id;
  document.getElementById('delete-name').textContent = name;
  openModal('delete-modal');
}

async function confirmDelete() {
  const btn = document.getElementById('confirm-delete-btn');
  setLoading(btn, true);
  try {
    await API.delete('api/hospitals.php?id=' + deleteId);
    toast('Hospital deleted','success');
    closeModal('delete-modal');
    loadHospitals();
  } catch (e) {
    toast(e.message,'error');
  } finally {
    setLoading(btn, false);
  }
}

document.getElementById('search').addEventListener('keydown', e => { if (e.key==='Enter') applyFilters(); });
</script>
</body>
</html>
