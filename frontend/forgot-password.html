<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Health Platform</title>
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="auth-page">
<div class="auth-container" style="justify-content:center;background:var(--color-bg);">
    <div class="auth-form-side">
        <div class="auth-form-wrapper">
            <div style="text-align:center;margin-bottom:var(--space-6);">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none" style="margin:auto;">
                    <rect width="48" height="48" rx="12" fill="#1a5276"/>
                    <path d="M24 10v28M10 24h28" stroke="white" stroke-width="5" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="auth-header">
                <h2>Reset Password</h2>
                <p>Enter your email address and we'll send you a reset link.</p>
            </div>

            <div id="alert-container"></div>

            <form id="forgot-form" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="you@organization.org" required>
                    <span class="field-error" id="email-error"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
                    <span class="btn-text">Send Reset Link</span>
                    <span class="btn-spinner hidden">&#9696;</span>
                </button>
            </form>

            <p class="auth-footer"><a href="/">&larr; Back to Login</a></p>
        </div>
    </div>
</div>

<script src="/assets/js/api.js"></script>
<script>
document.getElementById('forgot-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const btn   = document.getElementById('submit-btn');
    if (!email) { document.getElementById('email-error').textContent = 'Email is required.'; return; }
    btn.disabled = true;
    try {
        await API.post('/auth/forgot-password', { email });
        document.getElementById('alert-container').innerHTML = '<div class="alert alert-success">If that email exists, a reset link has been sent. Check your inbox.</div>';
        this.style.display = 'none';
    } catch (err) {
        document.getElementById('alert-container').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        btn.disabled = false;
    }
});
</script>
</body>
</html>
