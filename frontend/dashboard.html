<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Health Platform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app-layout">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">Health<span>+</span></div>
      <div class="brand-sub">Information Management</div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">Main</div>
      <a href="dashboard.html"   class="sb-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="submissions.html" class="sb-link"><i class="bi bi-file-earmark-text"></i> Submissions</a>
      <a href="forms.html"       class="sb-link"><i class="bi bi-ui-checks-grid"></i> Forms</a>
      <a href="fbgdsd.html"      class="sb-link"><i class="bi bi-people"></i> FBGDSD</a>
      <div class="nav-section manager-only">Management</div>
      <a href="hospitals.html"   class="sb-link manager-only"><i class="bi bi-hospital"></i> Hospitals</a>
      <a href="users.html"       class="sb-link admin-only"><i class="bi bi-person-lines-fill"></i> Users</a>
      <a href="reports.html"     class="sb-link manager-only"><i class="bi bi-bar-chart-line"></i> Reports</a>
    </div>
    <div class="sidebar-footer">
      <div class="d-flex align-items-center gap-2">
        <div class="avatar" id="sidebar-avatar">U</div>
        <div class="overflow-hidden">
          <div class="sidebar-user-name" id="sidebar-user-name">Loading…</div>
          <div class="sidebar-user-role" id="sidebar-user-role"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <div class="app-main">
    <header class="topbar">
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle sidebar">
        <i class="bi bi-list"></i>
      </button>
      <h1 class="topbar-title">Dashboard</h1>
      <div class="ms-auto d-flex align-items-center gap-2">
        <div class="d-none d-md-block text-end">
          <div class="small fw-semibold lh-1" id="user-name">Loading…</div>
          <div class="text-muted lh-1 mt-1" style="font-size:.72rem" id="user-role"></div>
        </div>
        <div class="avatar" id="user-avatar">U</div>
        <button onclick="logout()" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
      </div>
    </header>

    <div class="app-content">
      <!-- Page header -->
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
          <h2 class="h5 fw-bold mb-0">Overview</h2>
          <p class="text-muted small mb-0" id="date-display"></p>
        </div>
        <a href="submissions.html" class="btn btn-primary btn-sm">
          <i class="bi bi-plus-lg me-1"></i>New Submission
        </a>
      </div>

      <!-- Stats -->
      <div class="row g-3 mb-4" id="stats-grid">
        <div class="col-12">
          <div class="text-center text-muted py-4">
            <div class="spinner-border spinner-border-sm" role="status"></div> Loading stats…
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="row g-4 mb-4">
        <div class="col-lg-7">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-header border-bottom py-3">
              <span class="fw-semibold"><i class="bi bi-bar-chart-fill text-primary me-2"></i>Submissions — Last 30 Days</span>
            </div>
            <div class="card-body" style="height:240px;position:relative">
              <canvas id="trend-chart"></canvas>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-header border-bottom py-3">
              <span class="fw-semibold"><i class="bi bi-pie-chart-fill text-primary me-2"></i>By Status</span>
            </div>
            <div class="card-body" style="height:240px;position:relative">
              <canvas id="status-chart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- Recent submissions -->
      <div class="card border-0 shadow-sm">
        <div class="card-header border-bottom py-3 d-flex align-items-center justify-content-between">
          <span class="fw-semibold"><i class="bi bi-clock-history text-primary me-2"></i>Recent Submissions</span>
          <a href="submissions.html" class="btn btn-sm btn-outline-secondary">View All <i class="bi bi-arrow-right ms-1"></i></a>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Form</th>
                <th>Hospital</th>
                <th class="d-none d-md-table-cell">Submitted By</th>
                <th>Status</th>
                <th class="d-none d-md-table-cell">Date</th>
              </tr>
            </thead>
            <tbody id="recent-body">
              <tr><td colspan="5" class="text-center text-muted py-4">
                <div class="spinner-border spinner-border-sm" role="status"></div> Loading…
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('date-display').textContent =
  new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

(async () => {
  await requireAuth();

  let data;
  try {
    const res = await API.get('api/dashboard.php');
    data = res.data;
  } catch (e) {
    toast('Failed to load dashboard: ' + e.message, 'error');
    return;
  }

  const s = data.stats;
  const statCards = [
    { label: 'Total Submissions', value: s.total_submissions, icon: 'bi-file-earmark-text-fill', bg: 'bg-primary bg-opacity-10', iconColor: 'text-primary' },
    { label: 'Pending Review',    value: s.pending_review,    icon: 'bi-hourglass-split',         bg: 'bg-warning bg-opacity-10', iconColor: 'text-warning' },
    { label: 'Approved',          value: s.approved,          icon: 'bi-check-circle-fill',       bg: 'bg-success bg-opacity-10', iconColor: 'text-success' },
    { label: 'Rejected',          value: s.rejected,          icon: 'bi-x-circle-fill',           bg: 'bg-danger bg-opacity-10',  iconColor: 'text-danger'  },
    { label: 'Hospitals',         value: s.total_hospitals,   icon: 'bi-hospital-fill',           bg: 'bg-info bg-opacity-10',    iconColor: 'text-info'    },
    { label: 'Published Forms',   value: s.total_forms,       icon: 'bi-ui-checks-grid',          bg: 'bg-success bg-opacity-10', iconColor: 'text-success' },
    { label: 'Active Users',      value: s.total_users,       icon: 'bi-people-fill',             bg: 'bg-warning bg-opacity-10', iconColor: 'text-warning' },
    { label: 'This Month',        value: s.this_month,        icon: 'bi-calendar-check-fill',     bg: 'bg-primary bg-opacity-10', iconColor: 'text-primary' },
  ];

  document.getElementById('stats-grid').innerHTML = statCards.map(c => `
    <div class="col-6 col-xl-3">
      <div class="stat-card">
        <div class="d-flex align-items-start gap-3">
          <div class="stat-icon-box ${c.bg}">
            <i class="bi ${c.icon} ${c.iconColor}"></i>
          </div>
          <div>
            <div class="stat-value">${c.value ?? 0}</div>
            <div class="stat-label">${c.label}</div>
          </div>
        </div>
      </div>
    </div>`).join('');

  // Trend chart
  const trendData = data.trend || [];
  new Chart(document.getElementById('trend-chart'), {
    type: 'bar',
    data: {
      labels: trendData.map(r => r.day ? r.day.slice(5) : ''),
      datasets: [{ label: 'Submissions', data: trendData.map(r => parseInt(r.count) || 0), backgroundColor: '#2563eb', borderRadius: 4 }],
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } },
  });

  // Status doughnut
  const byStatus = data.byStatus || [];
  const statusColors = { draft:'#94a3b8', submitted:'#2563eb', approved:'#22c55e', rejected:'#ef4444' };
  new Chart(document.getElementById('status-chart'), {
    type: 'doughnut',
    data: {
      labels: byStatus.map(r => r.status),
      datasets: [{ data: byStatus.map(r => parseInt(r.count)), backgroundColor: byStatus.map(r => statusColors[r.status] || '#94a3b8'), borderWidth: 2 }],
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } },
  });

  // Recent table
  const tbody = document.getElementById('recent-body');
  if (!data.recent || data.recent.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No submissions yet</td></tr>';
  } else {
    tbody.innerHTML = data.recent.map(r => `
      <tr>
        <td><a href="submissions.html?id=${esc(r.id)}" class="fw-semibold text-decoration-none">${esc(r.form)}</a></td>
        <td class="text-muted small">${esc(r.hospital)}</td>
        <td class="d-none d-md-table-cell text-muted small">${esc(r.submitted_by)}</td>
        <td>${badge(r.status)}</td>
        <td class="d-none d-md-table-cell text-muted small">${fmtDateTime(r.submitted_at)}</td>
      </tr>`).join('');
  }
})();
</script>
</body>
</html>
