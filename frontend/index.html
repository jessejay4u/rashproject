<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Health Platform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-bg">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="login-logo-box">🏥</div>
      <h1 class="h4 fw-bold mb-1">Health Platform</h1>
      <p class="text-muted small">Digital Health Information Management</p>
    </div>

    <div class="alert alert-danger d-none small py-2 px-3" id="login-error" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold small">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" placeholder="admin@healthplatform.org" required autocomplete="email">
        </div>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label fw-semibold small">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="••••••••••" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold" id="login-btn">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </form>

    <p class="text-center mt-4 text-muted" style="font-size:.72rem">
      Default: admin@healthplatform.org / Admin@12345!
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
  API.get('api/me.php').then(() => { window.location.href = 'dashboard.html'; }).catch(() => {});

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    err.classList.add('d-none');
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Signing in…';
    btn.disabled = true;

    try {
      await API.post('api/login.php', {
        email:    document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });
      window.location.href = 'dashboard.html';
    } catch (ex) {
      err.textContent = ex.message;
      err.classList.remove('d-none');
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';
      btn.disabled  = false;
    }
  });
</script>
</body>
</html>
