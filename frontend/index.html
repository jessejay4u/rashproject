<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Health Platform</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-bg">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo-icon">🏥</div>
      <h1>Health Platform</h1>
      <p>Digital Health Information Management</p>
    </div>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address <span class="req">*</span></label>
        <input type="email" id="email" placeholder="admin@healthplatform.org" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password <span class="req">*</span></label>
        <input type="password" id="password" placeholder="••••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-full" id="login-btn" style="margin-top:8px;">
        Sign In
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:.75rem;color:var(--text-m);">
      Default: admin@healthplatform.org / Admin@12345!
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // Already logged in? Go to dashboard
  API.get('api/me.php').then(() => { window.location.href = 'dashboard.html'; }).catch(() => {});

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    err.style.display = 'none';
    btn.innerHTML = '<span class="spinner"></span> Signing in…';
    btn.disabled = true;

    try {
      await API.post('api/login.php', {
        email:    document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });
      window.location.href = 'dashboard.html';
    } catch (ex) {
      err.textContent  = ex.message;
      err.style.display = 'block';
      btn.innerHTML = 'Sign In';
      btn.disabled  = false;
    }
  });
</script>
</body>
</html>
