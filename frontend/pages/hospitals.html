<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="page-title" content="Hospitals">
    <title>Hospitals — Health Platform</title>
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-header"><div class="sidebar-logo"><svg width="32" height="32" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="10" fill="#2e86c1"/><path d="M24 10v28M10 24h28" stroke="white" stroke-width="5" stroke-linecap="round"/></svg><span>HealthPlatform</span></div></div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer" id="sidebar-user"></div>
    </aside>
    <div class="main-content">
        <header class="topbar">
            <h1 class="topbar-title" id="page-title">Hospitals</h1>
            <div class="topbar-actions">
                <button class="btn btn-primary btn-sm" id="btn-add-hospital">+ Add Hospital</button>
            </div>
        </header>
        <main class="page-content">
            <div class="card">
                <div class="filters-bar">
                    <input type="search" id="search-hospitals" placeholder="Search hospitals…">
                    <select id="filter-type">
                        <option value="">All types</option>
                        <option value="general">General</option>
                        <option value="specialized">Specialized</option>
                        <option value="clinic">Clinic</option>
                        <option value="health_post">Health Post</option>
                    </select>
                    <select id="filter-region">
                        <option value="">All regions</option>
                    </select>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>Name</th><th>Code</th><th>Type</th><th>Region</th><th>Submissions (30d)</th><th>Last Submission</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="hospitals-table">
                            <tr><td colspan="7" class="text-center text-muted" style="padding:32px;">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="pagination-container"></div>
            </div>
        </main>
    </div>
</div>

<!-- Add Hospital Modal -->
<div class="modal-overlay hidden" id="add-modal">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title">Add Hospital</span>
            <button class="modal-close" id="add-modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-row">
                <div class="form-group"><label>Hospital Name *</label><input type="text" id="h-name" placeholder="e.g. Central Hospital"></div>
                <div class="form-group"><label>Code *</label><input type="text" id="h-code" placeholder="e.g. CENT-001"></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Type *</label>
                    <select id="h-type">
                        <option value="general">General</option>
                        <option value="specialized">Specialized</option>
                        <option value="clinic">Clinic</option>
                        <option value="health_post">Health Post</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Facility Level</label>
                    <select id="h-level">
                        <option value="1">Level 1</option>
                        <option value="2">Level 2</option>
                        <option value="3">Level 3</option>
                        <option value="4">Level 4</option>
                        <option value="5">Level 5</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Region *</label>
                <select id="h-region"><option value="">Select region…</option></select>
            </div>
            <div class="form-group"><label>Address</label><input type="text" id="h-address" placeholder="Physical address"></div>
            <div class="form-row">
                <div class="form-group"><label>Phone</label><input type="text" id="h-phone"></div>
                <div class="form-group"><label>Email</label><input type="email" id="h-email"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Latitude</label><input type="number" id="h-lat" step="0.0000001"></div>
                <div class="form-group"><label>Longitude</label><input type="number" id="h-lon" step="0.0000001"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" id="add-cancel">Cancel</button>
            <button class="btn btn-primary" id="add-save">Save Hospital</button>
        </div>
    </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/app.js"></script>
<script>
(async function () {
    let currentPage = 1;

    async function load(page = 1) {
        currentPage = page;
        const params = { page, per_page: 20, search: document.getElementById('search-hospitals').value, type: document.getElementById('filter-type').value, region_id: document.getElementById('filter-region').value };
        const tbody = document.getElementById('hospitals-table');
        tbody.innerHTML = '<tr><td colspan="7" class="text-center" style="padding:24px;"><div class="spinner" style="margin:auto;"></div></td></tr>';

        try {
            const res = await API.get('/hospitals', params);
            renderTable(res.data);
            App.renderPagination(document.getElementById('pagination-container'), res.meta, load);
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger" style="padding:24px;">${App.escHtml(err.message)}</td></tr>`;
        }
    }

    function renderTable(rows) {
        const tbody = document.getElementById('hospitals-table');
        if (!rows.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted" style="padding:32px;">No hospitals found.</td></tr>'; return; }
        tbody.innerHTML = rows.map(h => `
            <tr>
                <td><span style="font-weight:500;">${App.escHtml(h.name)}</span></td>
                <td><code>${App.escHtml(h.code)}</code></td>
                <td><span class="badge badge-info">${App.escHtml(h.type)}</span></td>
                <td>${App.escHtml(h.region_name)}</td>
                <td>${App.formatNumber(h.monthly_submissions || 0)}</td>
                <td class="text-muted">${h.last_submission ? App.formatDate(h.last_submission) : '<span class="text-danger">Never</span>'}</td>
                <td><a href="/pages/hospital-detail.html?id=${h.id}" class="btn btn-ghost btn-sm">View</a></td>
            </tr>`).join('');
    }

    // Load regions for filter and form
    async function loadRegions() {
        try {
            const res = await API.get('/hospitals', { per_page: 1 }); // regions endpoint not yet added
            // fallback: just load via direct fetch
        } catch (_) {}
    }

    // Add hospital modal
    document.getElementById('btn-add-hospital').addEventListener('click', () => document.getElementById('add-modal').classList.remove('hidden'));
    document.getElementById('add-modal-close').addEventListener('click', () => document.getElementById('add-modal').classList.add('hidden'));
    document.getElementById('add-cancel').addEventListener('click', () => document.getElementById('add-modal').classList.add('hidden'));

    document.getElementById('add-save').addEventListener('click', async function () {
        const name = document.getElementById('h-name').value.trim();
        const code = document.getElementById('h-code').value.trim();
        const region = document.getElementById('h-region').value;
        if (!name || !code || !region) { App.toast('Name, code and region are required', 'warning'); return; }

        this.disabled = true;
        try {
            await API.post('/hospitals', {
                name, code, region_id: region,
                type: document.getElementById('h-type').value,
                level: parseInt(document.getElementById('h-level').value),
                address: document.getElementById('h-address').value || null,
                phone: document.getElementById('h-phone').value || null,
                email: document.getElementById('h-email').value || null,
                latitude: parseFloat(document.getElementById('h-lat').value) || null,
                longitude: parseFloat(document.getElementById('h-lon').value) || null,
            });
            App.toast('Hospital added', 'success');
            document.getElementById('add-modal').classList.add('hidden');
            load(1);
        } catch (err) {
            App.toast('Failed: ' + err.message, 'error');
        } finally { this.disabled = false; }
    });

    let t;
    document.getElementById('search-hospitals').addEventListener('input', function () { clearTimeout(t); t = setTimeout(() => load(1), 400); });
    ['filter-type', 'filter-region'].forEach(id => document.getElementById(id).addEventListener('change', () => load(1)));
    load();
})();
</script>
</body>
</html>
