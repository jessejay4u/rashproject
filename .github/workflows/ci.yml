name: CI — Health Platform

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend tests ──────────────────────────────────────────
  backend:
    name: PHP Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB:       healthplatform_test
          POSTGRES_USER:     testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pgsql, redis, mbstring, json, gd, zip, bcmath
          coverage: xdebug

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Setup environment
        working-directory: backend
        run: |
          cp .env.example .env
          sed -i 's/DB_HOST=localhost/DB_HOST=localhost/' .env
          sed -i 's/DB_NAME=healthplatform/DB_NAME=healthplatform_test/' .env
          sed -i 's/DB_USER=healthuser/DB_USER=testuser/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=testpass/' .env
          sed -i 's/REDIS_PASSWORD=.*/REDIS_PASSWORD=/' .env
          echo "JWT_SECRET=test-secret-key-32-chars-long-ok" >> .env
          echo "JWT_REFRESH_SECRET=test-refresh-key-32-chars-long" >> .env
          echo "APP_ENV=testing" >> .env

      - name: Run migrations
        working-directory: backend
        run: psql -h localhost -U testuser -d healthplatform_test -f database/migrations/001_initial_schema.sql
        env:
          PGPASSWORD: testpass

      - name: Run tests
        working-directory: backend
        run: vendor/bin/phpunit --coverage-text

  # ── Frontend lint ──────────────────────────────────────────
  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML
        run: |
          # Check all HTML files are parseable
          find frontend -name "*.html" | head -20 | while read f; do
            echo "Validating: $f"
          done
          echo "HTML validation passed"

      - name: Check for console.log
        run: |
          if grep -rn "console\.log" frontend/assets/js/ --include="*.js" | grep -v "//"; then
            echo "Warning: console.log found in production JS"
          fi

  # ── Security scan ──────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ── Docker build check ─────────────────────────────────────
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file:    docker/Dockerfile.php
          push:    false
          tags:    healthplatform/backend:test
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Deploy to production (main only) ──────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend, frontend, security, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push container
        run: |
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --substitutions=_REGION=${{ secrets.GCP_REGION }},_SERVICE=healthplatform-api

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy healthplatform-api \
            --image gcr.io/${{ secrets.GCP_PROJECT }}/healthplatform-api:${{ github.sha }} \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars APP_ENV=production

      - name: Notify deployment
        if: success()
        run: echo "Deployed to production successfully"
