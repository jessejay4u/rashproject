version: '3.8'

services:
  app:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.php
    container_name: healthplatform_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../backend:/var/www/html
      - ../frontend:/var/www/frontend
      - app_storage:/var/www/html/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-healthplatform}
      - DB_USER=${DB_USER:-healthuser}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - STORAGE_PATH=/var/www/html/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - healthplatform_net

  postgres:
    image: postgres:15-alpine
    container_name: healthplatform_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-healthplatform}
      - POSTGRES_USER=${DB_USER:-healthuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-healthuser} -d ${DB_NAME:-healthplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthplatform_net

  redis:
    image: redis:7-alpine
    container_name: healthplatform_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthplatform_net

  worker:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.php
    container_name: healthplatform_worker
    restart: unless-stopped
    command: php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ../backend:/var/www/html
      - app_storage:/var/www/html/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-healthplatform}
      - DB_USER=${DB_USER:-healthuser}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - postgres
      - redis
    networks:
      - healthplatform_net

  nginx:
    image: nginx:alpine
    container_name: healthplatform_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend:/var/www/frontend:ro
      - ../backend/public:/var/www/html/public:ro
      - ssl_certs:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - healthplatform_net

volumes:
  postgres_data:
  redis_data:
  app_storage:
  ssl_certs:

networks:
  healthplatform_net:
    driver: bridge
