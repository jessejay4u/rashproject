<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Health Platform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="d-flex">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">Health<span>+</span></div>
      <div class="brand-sub">Information Management</div>
    </div>
    <div class="flex-grow-1">
      <div class="nav-section-label">Main</div>
      <a href="dashboard.html"   class="sidebar-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="submissions.html" class="sidebar-link"><i class="bi bi-clipboard-data"></i> Submissions</a>
      <a href="forms.html"       class="sidebar-link"><i class="bi bi-file-earmark-text"></i> Forms</a>
      <div class="nav-section-label manager-only">Management</div>
      <a href="hospitals.html" class="sidebar-link manager-only"><i class="bi bi-hospital"></i> Hospitals</a>
      <a href="users.html"     class="sidebar-link admin-only"><i class="bi bi-people"></i> Users</a>
      <a href="reports.html"   class="sidebar-link manager-only"><i class="bi bi-bar-chart-line"></i> Reports</a>
    </div>
    <div class="sidebar-footer">
      <div class="d-flex align-items-center gap-2">
        <div class="sidebar-avatar" id="sidebar-avatar">U</div>
        <div>
          <div class="user-name-sb" id="sidebar-user-name">Loading…</div>
          <div class="user-role-sb" id="sidebar-user-role"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <div class="main-content flex-grow-1">
    <!-- Topbar -->
    <nav class="navbar bg-white border-bottom px-3 py-2 sticky-top shadow-sm">
      <button class="btn btn-link text-dark d-lg-none p-1 me-2" id="menu-toggle">
        <i class="bi bi-list fs-4"></i>
      </button>
      <span class="navbar-brand mb-0 fw-bold">Dashboard</span>
      <div class="ms-auto d-flex align-items-center gap-3">
        <div class="d-none d-md-block text-end lh-sm">
          <div class="fw-semibold small" id="user-name">Loading…</div>
          <div class="text-muted" style="font-size:.72rem" id="user-role"></div>
        </div>
        <div class="avatar" id="user-avatar">U</div>
        <button onclick="logout()" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
      </div>
    </nav>

    <div class="container-fluid p-4">
      <!-- Page header -->
      <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">
        <div>
          <h4 class="fw-bold mb-1">Overview</h4>
          <p class="text-muted mb-0 small" id="date-display"></p>
        </div>
        <a href="submissions.html" class="btn btn-primary">
          <i class="bi bi-plus-lg me-1"></i>New Submission
        </a>
      </div>

      <!-- Stats -->
      <div class="row g-3 mb-4" id="stats-grid">
        <div class="col-12">
          <div class="card border-0 bg-white text-center py-4 shadow-sm">
            <span class="text-muted">Loading stats…</span>
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="row g-3 mb-4">
        <div class="col-xl-7">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-header border-0 pb-0">
              <h6 class="fw-bold mb-0">Submissions — Last 30 Days</h6>
            </div>
            <div class="card-body" style="height:240px;position:relative">
              <canvas id="trend-chart"></canvas>
            </div>
          </div>
        </div>
        <div class="col-xl-5">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-header border-0 pb-0">
              <h6 class="fw-bold mb-0">By Status</h6>
            </div>
            <div class="card-body" style="height:240px;position:relative">
              <canvas id="status-chart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- Recent -->
      <div class="card border-0 shadow-sm">
        <div class="card-header border-0 d-flex justify-content-between align-items-center py-3">
          <h6 class="fw-bold mb-0">Recent Submissions</h6>
          <a href="submissions.html" class="btn btn-outline-secondary btn-sm">View All</a>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Form</th>
                <th>Hospital</th>
                <th class="d-none d-md-table-cell">Submitted By</th>
                <th>Status</th>
                <th class="d-none d-md-table-cell">Date</th>
              </tr>
            </thead>
            <tbody id="recent-body">
              <tr><td colspan="5" class="text-center text-muted py-4">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('date-display').textContent =
  new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

(async () => {
  await requireAuth();

  let data;
  try {
    const res = await API.get('api/dashboard.php');
    data = res.data;
  } catch (e) {
    toast('Failed to load dashboard: ' + e.message, 'error'); return;
  }

  const s = data.stats;
  document.getElementById('stats-grid').innerHTML = `
    <div class="col-sm-6 col-xl-3">
      <div class="card stat-card stat-blue p-3 shadow-sm">
        <div class="stat-icon">📋</div>
        <div class="stat-value">${s.total_submissions}</div>
        <div class="stat-label">Total Submissions</div>
      </div>
    </div>
    <div class="col-sm-6 col-xl-3">
      <div class="card stat-card stat-orange p-3 shadow-sm">
        <div class="stat-icon">⏳</div>
        <div class="stat-value">${s.pending_review}</div>
        <div class="stat-label">Pending Review</div>
      </div>
    </div>
    <div class="col-sm-6 col-xl-3">
      <div class="card stat-card stat-green p-3 shadow-sm">
        <div class="stat-icon">✅</div>
        <div class="stat-value">${s.approved}</div>
        <div class="stat-label">Approved</div>
      </div>
    </div>
    <div class="col-sm-6 col-xl-3">
      <div class="card stat-card stat-red p-3 shadow-sm">
        <div class="stat-icon">❌</div>
        <div class="stat-value">${s.rejected}</div>
        <div class="stat-label">Rejected</div>
      </div>
    </div>
    <div class="col-sm-6 col-xl-3">
      <div class="card stat-card stat-blue p-3 shadow-sm">
        <div class="stat-icon">🏥</div>
        <div class="stat-value">${s.total_hospitals}</div>
        <div class="stat-label">Hospitals</div>
      </div>
    </div>
    <div class="col-sm-6 col-xl-3">
      <div class="card stat-card stat-green p-3 shadow-sm">
        <div class="stat-icon">📝</div>
        <div class="stat-value">${s.total_forms}</div>
        <div class="stat-label">Published Forms</div>
      </div>
    </div>
    <div class="col-sm-6 col-xl-3">
      <div class="card stat-card stat-orange p-3 shadow-sm">
        <div class="stat-icon">👥</div>
        <div class="stat-value">${s.total_users}</div>
        <div class="stat-label">Active Users</div>
      </div>
    </div>
    <div class="col-sm-6 col-xl-3">
      <div class="card stat-card stat-blue p-3 shadow-sm">
        <div class="stat-icon">📅</div>
        <div class="stat-value">${s.this_month}</div>
        <div class="stat-label">This Month</div>
      </div>
    </div>
  `;

  const trendData = data.trend || [];
  new Chart(document.getElementById('trend-chart'), {
    type: 'bar',
    data: {
      labels: trendData.map(r => r.day ? r.day.slice(5) : ''),
      datasets: [{ label: 'Submissions', data: trendData.map(r => parseInt(r.count)||0), backgroundColor: '#2563eb', borderRadius: 4 }]
    },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{stepSize:1}}} },
  });

  const byStatus = data.byStatus || [];
  const sColors  = { draft:'#94a3b8', submitted:'#3b82f6', approved:'#22c55e', rejected:'#ef4444' };
  new Chart(document.getElementById('status-chart'), {
    type: 'doughnut',
    data: {
      labels: byStatus.map(r => r.status),
      datasets: [{ data: byStatus.map(r => parseInt(r.count)), backgroundColor: byStatus.map(r => sColors[r.status]||'#94a3b8'), borderWidth:2 }],
    },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}} },
  });

  const tbody = document.getElementById('recent-body');
  if (!data.recent || data.recent.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No submissions yet</td></tr>';
  } else {
    tbody.innerHTML = data.recent.map(r => `
      <tr>
        <td><a href="submissions.html?id=${esc(r.id)}" class="text-decoration-none fw-semibold">${esc(r.form)}</a></td>
        <td class="text-muted small">${esc(r.hospital)}</td>
        <td class="d-none d-md-table-cell text-muted small">${esc(r.submitted_by)}</td>
        <td>${badge(r.status)}</td>
        <td class="d-none d-md-table-cell text-muted small">${fmtDateTime(r.submitted_at)}</td>
      </tr>
    `).join('');
  }
})();
</script>
</body>
</html>
