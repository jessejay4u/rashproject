<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Health Platform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">Health<span>+</span></div>
    <div class="login-title">Welcome Back</div>
    <div class="login-sub">Sign in to your account to continue</div>

    <div id="login-alert" class="alert-box" style="display:none"></div>

    <form id="login-form" onsubmit="doLogin(event)">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-icon-wrap">
          <i class="bi bi-envelope input-icon"></i>
          <input type="email" id="email" class="form-ctrl with-icon" placeholder="admin@example.com" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-icon-wrap">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" id="password" class="form-ctrl with-icon" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" id="login-btn" class="btn btn-primary w-100 mt-2">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <p class="login-hint">Default credentials: <strong>admin@health.org</strong> / <strong>password</strong></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    (async () => {
      try {
        await API.get('api/me.php');
        window.location.href = 'dashboard.html';
      } catch {}
    })();

    async function doLogin(e) {
      e.preventDefault();
      const btn   = document.getElementById('login-btn');
      const alertEl = document.getElementById('login-alert');
      alertEl.style.display = 'none';
      setLoading(btn, true);
      try {
        await API.post('api/login.php', {
          email:    document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        window.location.href = 'dashboard.html';
      } catch (err) {
        alertEl.textContent   = err.message || 'Invalid credentials';
        alertEl.style.display = 'block';
        setLoading(btn, false);
      }
    }
  </script>
</body>
</html>
