<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Health Platform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-bg">
  <div class="card shadow-lg border-0" style="width:100%;max-width:420px;border-radius:16px;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <div style="font-size:3rem;line-height:1">🏥</div>
        <h1 class="h4 fw-bold mt-3 mb-1">Health Platform</h1>
        <p class="text-muted small mb-0">Digital Health Information Management</p>
      </div>

      <div class="alert alert-danger d-none py-2" id="login-error"></div>

      <form id="login-form">
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold small">Email Address</label>
          <input type="email" class="form-control" id="email"
                 placeholder="admin@healthplatform.org" required autocomplete="email">
        </div>
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold small">Password</label>
          <input type="password" class="form-control" id="password"
                 placeholder="••••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2" id="login-btn">
          Sign In
        </button>
      </form>

      <p class="text-center text-muted mt-4 mb-0" style="font-size:.72rem">
        Default: admin@healthplatform.org / Admin@12345!
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
  API.get('api/me.php').then(() => { window.location.href = 'dashboard.html'; }).catch(() => {});

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    err.classList.add('d-none');
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in…';
    btn.disabled  = true;
    try {
      await API.post('api/login.php', {
        email:    document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });
      window.location.href = 'dashboard.html';
    } catch (ex) {
      err.textContent = ex.message;
      err.classList.remove('d-none');
      btn.innerHTML = 'Sign In';
      btn.disabled  = false;
    }
  });
</script>
</body>
</html>
